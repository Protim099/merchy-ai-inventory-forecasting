services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: merchy
      POSTGRES_USER: merchy
      POSTGRES_PASSWORD: merchy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - merchy_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchy -d merchy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://merchy:merchy_dev_password@db:5432/merchy
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  merchy_db:
